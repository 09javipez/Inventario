databases:
  - name: inventario-db
    plan: free
    databaseName: inventario
    user: inventario_admin

services:
  - type: web
    name: inventario-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Inventario
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:9zsVb5+YgPvilBv6Qq52+4Q2WpOIwwqrDaR4l886XWc="
      - key: APP_URL
        value: https://inventario-web-cmvi.onrender.com
      -   key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: TU_HOST_DE_INVENTARIOS.FREE.JE
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: TU_NOMBRE_DE_BASE_DE_DATOS
      - key: DB_USERNAME
        value: TU_USUARIO
      - key: DB_PASSWORD
        value: TU_CONTRASEÑA

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
